spring.application.name=wework-back

# 실행 환경 (로컬 local, 배포 prod, 테스트는 test 클래스에서 지정)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# DB 연결 (${환경변수:로컬값} : 배포 시 환경변수로 교체)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/wework}
spring.datasource.username=${DB_USERNAME:wework}
spring.datasource.password=${DB_PASSWORD:wework}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

# 실행되는 SQL 로그 출력
logging.level.org.hibernate.SQL=debug

# JWT
jwt.secret=${JWT_SECRET:wework-local-dev-secret-key-must-be-at-least-32-bytes-long}
jwt.access-token-days=1
jwt.refresh-token-days=14

# 초대 링크 (프론트 주소, 배포 시 환경변수로 교체)
app.invite.url=${APP_INVITE_URL:http://localhost:5173/invite}
app.invite.expire-hours=72

# Page 응답을 안정된 JSON 형식으로 (content + page 정보)
spring.data.web.pageable.serialization-mode=via-dto