# 테스트 전용 DB (개발용 wework DB와 분리)
spring.datasource.url=jdbc:postgresql://localhost:5433/wework_test
spring.datasource.username=wework
spring.datasource.password=wework

# 테스트 실행마다 테이블을 새로 만들고, 끝나면 삭제
spring.jpa.hibernate.ddl-auto=create-drop

# 테스트 로그를 깔끔하게 (SQL 출력 끔)
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=warn